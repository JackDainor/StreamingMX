<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Tienda de Ropa</h1>

<div class="products">
  <div class="product">
    <h3>Camiseta Negra</h3>
    <p>Precio: 50 Bs</p>
    <button onclick="openForm('Camiseta Negra', 50)">Comprar</button>
  </div>

  <div class="product">
    <h3>Vestido Rojo</h3>
    <p>Precio: 120 Bs</p>
    <button onclick="openForm('Vestido Rojo', 120)">Comprar</button>
  </div>

  <div class="product">
    <h3>Jeans Azul</h3>
    <p>Precio: 150 Bs</p>
    <button onclick="openForm('Jeans Azul', 150)">Comprar</button>
  </div>
</div>

<!-- FORMULARIO -->
<div id="formModal" class="modal">
  <div class="modal-content">
    <h2>Solicitud de compra</h2>

    <input type="text" id="cliente" placeholder="Tu nombre">
    <input type="text" id="whatsapp" placeholder="WhatsApp">

    <button onclick="enviarPedido()">Enviar pedido</button>
    <span class="close" onclick="closeForm()">✖</span>
  </div>
</div>
